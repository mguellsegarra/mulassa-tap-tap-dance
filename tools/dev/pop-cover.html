<!doctype html>
<!-- The app's cartridge art, figure plane (design/mulassa-games/app-home/ronda-38): the games' own models, posed, on a
     transparent 1200 × 812 canvas. ?game=pop: Pop's Mulassa, big, and its Drac behind (models.js, rigs.js); ?game=tap: Tap Tap
     Dance's Mulassa with her carriers, a moment of her dance (?t seconds). Captured headless with a transparent page
     (Chrome --headless=new --default-background-color=00000000 --window-size=1200,812 --screenshot), then scaled to
     720 × 487 as public/jocs/menu/cards/<game>-app-figura.png. The backdrops (<game>-app-fons.jpg) are pictures made
     apart: design/mulassa-games/app-home/ronda-38/astra (tap/tap-fons.png, pop/P2/pop-fons.png); <game>-app.jpg is both
     together, the backdrop 12 % bigger, for a shell that knows no planes. -->
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<canvas id="c" width="1200" height="812"></canvas>
<script type="module">
import * as THREE from 'three';
import { MAT } from '/src/scene/models/voxel.js';
import { buildPopPetard } from '/src/jocs/games/pop/models.js';
import { mulaRig, dracRig, poseMula, poseDrac, MULA_POSES, DRAC_POSES } from '/src/jocs/games/pop/rigs.js';
import { buildMulassa } from '/src/figures/mulassa/mulassa.js';
import { createCarriers } from '/src/figures/mulassa/mula-carriers.js';
import { poseMulassa } from '/src/figures/mulassa/mula-pose-rig.js';
import { mulaDance, newMulaPose } from '/src/figures/mulassa/mula-dance.js';
import { SUPPORT_LAYOUT } from '/src/figures/mulassa/mula-supports.js';

const q = new URLSearchParams(location.search), n = k => Number(q.get(k));
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(24, 1200 / 812, .1, 200);
// the portraits' light (portraits.js), a little lower so the faces catch it
const sun = new THREE.DirectionalLight('#ffe8c0', 2.4);
sun.position.set(-6, 12, 8);
scene.add(new THREE.HemisphereLight('#fff3d6', '#8a6a4a', 2.1), sun);

const at = (k, v) => (q.has(k) ? n(k) : v);
if (q.get('game') === 'tap') {
  // the Mulassa as Tap Tap Dance shows her, at second ?t of her dance, in place
  const rig = buildMulassa(), carriers = createCarriers(), pose = newMulaPose(), t = at('t', 0);
  const feet = SUPPORT_LAYOUT.map(() => ({ x: 0, y: 0, z: 0, yaw: 0, contact: true }));
  rig.root.add(carriers.group);
  mulaDance.pose(pose, t);
  for (let i = 0; i < 8; i++) mulaDance.foot(t, i, feet[i]);
  poseMulassa(rig, pose, pose.beat, 0, 0, pose.yaw);
  carriers.pose(rig, feet);
  const turn = new THREE.Group();
  turn.add(rig.root); turn.rotation.y = at('my', .7) - pose.yaw;
  scene.add(turn);
  cam.position.set(at('cx', 0), at('cy', 2.4), at('cz', 12.5));
  cam.lookAt(at('lx', 0), at('ly', 1.35), 0);
} else {
  const drac = dracRig();
  poseDrac(drac, DRAC_POSES[at('dp', 0)], 0, 0, at('fire', 0));
  drac.root.position.set(at('dx', 4.1), 0, at('dz', -3.2)); drac.root.rotation.y = at('dy', -.5); drac.root.scale.setScalar(at('ds', .62));
  const mula = mulaRig();
  poseMula(mula, MULA_POSES[at('mp', 2)]);
  mula.root.position.set(at('mx', -1.3), 0, at('mz', 1)); mula.root.rotation.y = at('my', .75); mula.root.scale.setScalar(at('ms', 1.9));
  scene.add(drac.root, mula.root);
  if (q.has('bomb')) { const bomb = buildPopPetard(); bomb.position.set(-.2, 0, 2.6); bomb.scale.setScalar(.62); scene.add(bomb); }
  cam.position.set(at('cx', -1.5), at('cy', 6.6), at('cz', 19.5));
  cam.lookAt(at('lx', -.2), at('ly', 2.9), 0);
}
scene.traverse(o => { if (o.isMesh && !o.material) o.material = MAT; });
renderer.render(scene, cam);
document.title = 'ready';
</script>
