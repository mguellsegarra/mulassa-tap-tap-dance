<!doctype html>
<html lang="ca" translate="no">
<head>
  <meta charset="utf-8">
  <!-- nothing in the game is dragged: the browser's own drag of a picture, logo or text (a ghost of it) would steal the pointer -->
  <script>addEventListener('dragstart', e => e.preventDefault());</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#11152c">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mulassa">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Mulassa Pop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/jocs/games/pica/style.css">
</head>
<body>
  <canvas id="game" data-t-aria="board" aria-label="Tauler de Mulassa Pop"></canvas>

  <div id="hud" hidden>
    <button id="pause" class="round-btn" data-t-aria="pause" aria-label="Pausa"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <div id="hud-mid">
      <div id="score" role="status">0</div>
      <div id="hud-best" aria-hidden="true"></div>
      <div id="chips"></div>
    </div>
    <button id="music" class="round-btn" data-t-aria="music" aria-label="Música" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="6.5" cy="18" r="2.8"/><circle cx="16.5" cy="16" r="2.8"/><path id="music-off" d="M4 4l16 16" stroke="#ff8a7a" stroke-width="2.6" stroke-linecap="round" hidden/></svg></button>
  </div>

  <div id="menu" class="cover">
    <svg class="logo" role="img" aria-label="Mulassa Pop" viewBox="0 0 308.6 113.1" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
      <g font-family="'Jersey 10'" font-size="100" stroke-width="12"><text x="154.3" y="66.6" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#5e1514" stroke="#5e1514">MULASSA</text><text x="154.3" y="60.6" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#c0283c" stroke="#fff3d6">MULASSA</text></g>
      <text x="154.3" y="105.8" font-family="'Baloo 2'" font-weight="800" font-size="46" letter-spacing="6" stroke-width="7.1" fill="#ff7ac6" stroke="#2a1a10">POP</text>
    </svg>
    <div class="art" id="menu-art"></div>
    <div class="sheet">
      <p class="result-sub" id="menu-best" hidden></p>
      <ul class="how" id="how-rules"></ul>
      <ul class="how goodies" id="how-goodies"></ul>
      <div class="sheet-actions"><button id="play" class="btn btn-primary" data-t="play">Juga</button>
        <a id="back" class="btn" href="/#jocs" data-t="back">Torna al joc principal</a></div>
    </div>
  </div>

  <div id="pause-menu" class="cover" hidden>
    <div class="sheet">
      <h2 data-t="pause">Pausa</h2>
      <div class="sheet-actions">
        <button id="resume" class="btn btn-primary" data-t="resume">Continua</button>
        <button id="quit" class="btn" data-t="quit">Surt</button>
      </div>
    </div>
  </div>

  <div id="end-menu" class="cover" hidden>
    <div class="art" id="end-art"></div>
    <div class="sheet">
      <h2 id="end-title"></h2>
      <p class="result" id="end-score">0</p>
      <p class="result-sub" id="end-best"></p>
      <div class="sheet-actions">
        <button id="again" class="btn btn-primary" data-t="again">Torna-hi</button>
        <button id="to-menu" class="btn" data-t="menu">Menú</button>
      </div>
    </div>
  </div>
  <div id="rotate" role="alert"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="arr" d="M24 5A19 19 0 0 1 43 24M39.5 20.5 43 24l3.5-3.5M24 43A19 19 0 0 1 5 24M8.5 27.5 5 24l-3.5 3.5"/><g class="ph"><rect x="18" y="10" width="12" height="28" rx="2.5"/><path d="M22.5 34h3"/></g></svg><h2><span class="r-phone" data-t="rotate.phone">Gira el mòbil</span><span class="r-tablet" data-t="rotate.tablet">Gira la tauleta</span></h2><b><span class="r-phone" data-t="rotate.phoneSub">En vertical per jugar</span><span class="r-tablet" data-t="rotate.tabletSub">En horitzontal per jugar</span></b></div>
  <script type="module" src="/src/jocs/games/pica/main.js"></script>
</body>
</html>
