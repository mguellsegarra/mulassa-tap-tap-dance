<!doctype html><html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ball del Bou Tradicional</title><link rel="stylesheet" href="/tools/dev/bou-dance/style.css"></head><body>
<header><a href="/">Torna al selector</a><h1>Ball del Bou Tradicional</h1><p>La música aprovada i el model escollit, al ritme de cada frase.</p><p><a href="/tools/dev/bou-review.html">Compara amb el vídeo i escriu les correccions</a></p></header>
<main><div class="stage"><canvas id="stage" aria-label="Ball del Bou Tradicional a la plaça"></canvas><span id="phase" role="status">Preparant el ball…</span></div>
<section aria-label="Reproducció"><audio id="audio" controls preload="metadata" playsinline></audio><div class="controls"><label>Fragment<select id="fragment"></select></label><label>Vista<select id="view"><option value="front">Tres quarts</option><option value="side">Costat</option><option value="rear">Darrere</option><option value="top">Des de dalt</option></select></label><label>Velocitat<select id="speed"><option value="1">Normal</option><option value="0.5">Meitat</option></select></label></div>
<p id="info">Adaptació del ball per a aquesta versió de la música. L'aixecament col·lectiu queda pendent dels portadors exteriors.</p><p id="error" role="alert" hidden></p></section></main>
<script type="module" src="/tools/dev/bou-dance/main.js"></script></body></html>
