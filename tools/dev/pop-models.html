<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mulassa Pop: revisió de models</title>
<style>
  :root { --bg: #f4ead6; --card: #fffaf0; --ink: #33261a; --muted: #7a6a58; --line: #d9c9ae; --accent: #a3182f; --gap: 12px; --radius: 12px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.35 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); gap: var(--gap); padding: var(--gap); height: 100dvh; }
  button, select, textarea { font: inherit; color: inherit; }
  button, select { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #models { grid-column: 1 / -1; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  #models button { flex: none; }
  #models b { margin-left: 4px; }
  #stage { position: relative; min-height: 0; border-radius: var(--radius); overflow: hidden; background: #8a7a66; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #controls { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
  #hint { position: absolute; left: 12px; top: 10px; right: 12px; color: #fff; text-shadow: 0 1px 2px #0008; pointer-events: none; }
  .pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; border: 2px solid #fff; pointer-events: none; }
  aside { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--gap); padding: var(--gap); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  h2 { margin: 0; font-size: 16px; }
  textarea { width: 100%; min-height: 72px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; resize: vertical; }
  .note { display: grid; gap: 6px; }
  .note header { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
  .note header button { min-height: 32px; padding: 0 10px; }
  #empty { color: var(--muted); margin: 0; }
  #out { min-height: 120px; font: 12px/1.4 ui-monospace, monospace; }
  @media (max-width: 760px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 56dvh auto; height: auto; min-height: 100dvh; }
    aside { overflow: visible; }
  }
</style>
</head>
<body>
<nav id="models" aria-label="Models"></nav>
<main id="stage">
  <canvas id="c"></canvas>
  <div id="hint">Arrossega per girar, roda o pessic per apropar. Toca el model per clavar-hi una nota.</div>
  <div id="pins"></div>
  <div id="controls">
    <select id="pose" aria-label="Postura"></select>
    <button id="anim" aria-pressed="true">Animació</button>
    <button id="spin" aria-pressed="false">Gira sol</button>
    <button id="fire" aria-pressed="false">Foc</button>
    <button id="gamecam">Càmera del joc</button>
  </div>
</main>
<aside>
  <h2 id="title"></h2>
  <label for="general">Nota general del model</label>
  <textarea id="general" placeholder="Què hi canviaries?"></textarea>
  <h2>Notes clavades</h2>
  <p id="empty">Encara no n'hi ha.</p>
  <div id="notes" style="display:grid;gap:12px"></div>
  <h2>Enviar-me les notes</h2>
  <button id="copy">Copia totes les notes</button>
  <textarea id="out" readonly aria-label="Totes les notes"></textarea>
</aside>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MULA_POSES, DRAC_POSES, MULA_SCALE, MULA_YAW, DRAC_K, DRAC_YAW, poseMula, poseDrac, mulaRig, dracRig, redScales, greenVelvet } from '/src/jocs/games/pop/rigs.js';
import { buildPopPetard, buildPopCalcot, buildPopCampanar, buildPopCarretilla } from '/src/jocs/games/pop/models.js';

const $ = id => document.getElementById(id);
const STORE = 'pica-models-notes-simple'; // the notes written while there were two versions
const notes = JSON.parse(localStorage.getItem(STORE) || '{}'); // key: { general, pins: [{ part, pose, node, point, text }] }

const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#8a7a66');
// the board's own light (src/jocs/games/pop/board.js)
scene.add(new THREE.HemisphereLight('#fff3d6', '#8a6a4a', 2.1));
const sun = new THREE.DirectionalLight('#ffe8c0', 2.4);
sun.position.set(-9, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 70 });
scene.add(sun);
const camera = new THREE.PerspectiveCamera(20, 1, .5, 800);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;

// A game tile, so a figure's size against its cell is plain to see.
const tile = new THREE.Mesh(new THREE.BoxGeometry(3.14, .16, 4.14), new THREE.MeshLambertMaterial({ color: '#b89a6c' }));
tile.position.y = -.08;
tile.receiveShadow = true;
scene.add(tile);

function recolour(root, fn) {
  root.traverse(o => { if (o.isMesh && o.geometry.attributes.color) o.geometry = fn(o.geometry); });
}
const mule = (paint) => {
  const rig = mulaRig();
  if (paint) recolour(rig.root, paint);
  return { rig, kind: 'mula', k: MULA_SCALE, yaw: MULA_YAW, poses: MULA_POSES };
};
const drac = (paint) => {
  const rig = dracRig();
  if (paint) recolour(rig.root, paint);
  return { rig, kind: 'drac', k: DRAC_K, yaw: DRAC_YAW, poses: DRAC_POSES };
};
const prop = (mesh, k) => { const root = new THREE.Group(); root.add(mesh); return { rig: { root }, kind: 'prop', k, yaw: 0, poses: [] }; };

const MODELS = [
  ['mula', 'Mulassa', () => mule()],
  ['mulaFalsa', 'Mulassa falsa', () => mule(greenVelvet)],
  ['drac', 'Drac', () => drac()],
  ['dracFals', 'Drac vermell', () => drac(redScales)],
  ['petard', 'Petard', () => prop(buildPopPetard(), .7)],
  ['calcot', 'Calçot', () => prop(buildPopCalcot(), .82)],
  ['campanar', 'Campanar', () => prop(buildPopCampanar(), .62)],
  ['carretilla', 'Carretilla', () => prop(buildPopCarretilla(), .72)],
].map(([key, name, make]) => ({ key, name, ...make() }));

// What each pivot is called in a note.
function labelParts(m) {
  const { rig } = m, tag = (node, part) => { if (node) node.userData.part = part; };
  tag(rig.body, 'cos');
  if (m.kind === 'mula') {
    tag(rig.neck, 'coll'); tag(rig.head, 'cap'); tag(rig.jaw, 'mandíbula'); tag(rig.tail, 'cua');
    rig.ears.forEach(e => tag(e, 'orella'));
  }
  if (m.kind === 'drac') {
    rig.necks.forEach((n, i) => {
      const side = i ? 'esquerre' : 'dret';
      n.segs.forEach(s => tag(s, `coll ${side}`)); tag(n.head, `cap ${side}`); tag(n.jaw, `mandíbula ${side}`);
    });
    rig.wings.forEach((w, i) => tag(w.root, i ? 'ala esquerra' : 'ala dreta'));
    rig.tail.forEach(s => tag(s, 'cua'));
    rig.legs.forEach(l => { tag(l.shoe, 'peu'); tag(l.pants, 'cama'); });
  }
}
const partOf = o => { for (; o; o = o.parent) if (o.userData.part) return o.userData.part; return 'model'; };

for (const m of MODELS) {
  const { root } = m.rig;
  root.rotation.order = 'YXZ';
  root.rotation.y = m.yaw;
  root.scale.setScalar(m.k);
  root.traverse(o => { if (o.isMesh) o.castShadow = true; });
  labelParts(m);
  m.nodes = [];
  root.traverse(o => m.nodes.push(o));
  m.markers = [];
  root.visible = false;
  scene.add(root);
}

let current = MODELS[0], poseIndex = 0, time = 0;
const cl = n => (notes[n] ??= { general: '', pins: [] });
const save = () => { localStorage.setItem(STORE, JSON.stringify(notes)); renderExport(); renderTabs(); };

function renderTabs() {
  $('models').replaceChildren(...MODELS.map(m => {
    const b = document.createElement('button'), n = cl(m.key), count = n.pins.length + (n.general.trim() ? 1 : 0);
    b.textContent = m.name;
    if (count) { const c = document.createElement('b'); c.textContent = `(${count})`; b.append(c); }
    b.setAttribute('aria-pressed', m === current);
    b.onclick = () => select(m);
    return b;
  }));
}

function renderExport() {
  const lines = ['Models Mulassa Pop'];
  for (const m of MODELS) {
    const n = cl(m.key);
    if (!n.general.trim() && !n.pins.some(p => p.text.trim())) continue;
    lines.push('', `## ${m.name}`);
    if (n.general.trim()) lines.push(`General: ${n.general.trim()}`);
    n.pins.forEach((p, i) => { if (p.text.trim()) lines.push(`${i + 1}. [${p.part}${p.pose != null ? `, postura ${p.pose + 1}` : ''}] ${p.text.trim()}`); });
  }
  $('out').value = lines.join('\n');
}

const markerMat = new THREE.MeshBasicMaterial({ visible: false });
function placeMarkers(m) {
  m.markers.forEach(x => x.removeFromParent());
  m.markers = cl(m.key).pins.map(p => {
    const x = new THREE.Mesh(new THREE.SphereGeometry(.01), markerMat);
    x.position.fromArray(p.point);
    m.nodes[p.node].add(x);
    return x;
  });
  // new children must not shift the saved node indices: they are only ever appended under existing nodes, after m.nodes was listed
}

function renderNotes() {
  const n = cl(current.key);
  $('title').textContent = current.name;
  $('general').value = n.general;
  $('empty').hidden = n.pins.length > 0;
  $('notes').replaceChildren(...n.pins.map((p, i) => {
    const box = document.createElement('div'), head = document.createElement('header'), label = document.createElement('span'), del = document.createElement('button'), text = document.createElement('textarea');
    box.className = 'note';
    label.textContent = `${i + 1}. ${p.part}${p.pose != null ? `, postura ${p.pose + 1}` : ''}`;
    del.textContent = 'Treu';
    del.onclick = () => { n.pins.splice(i, 1); save(); placeMarkers(current); renderNotes(); };
    text.value = p.text;
    text.placeholder = 'Què hi canviaries?';
    text.oninput = () => { p.text = text.value; save(); };
    head.append(label, del);
    box.append(head, text);
    return box;
  }));
  $('pins').replaceChildren(...n.pins.map((_, i) => { const d = document.createElement('div'); d.className = 'pin'; d.textContent = i + 1; return d; }));
}

function gameCam() {
  // the board's tilt (50°), close on one tile
  const box = new THREE.Box3().setFromObject(current.rig.root), c = box.getCenter(new THREE.Vector3());
  orbit.target.set(0, Math.max(c.y, .6), 0);
  const dist = 15 / Math.min(1, camera.aspect * 1.3);
  camera.position.set(0, orbit.target.y + Math.sin(50 * Math.PI / 180) * dist, Math.cos(50 * Math.PI / 180) * dist);
}

function select(m) {
  current.rig.root.visible = false;
  current = m;
  m.rig.root.visible = true;
  poseIndex = 0;
  $('pose').hidden = !m.poses.length;
  $('pose').replaceChildren(...m.poses.map((_, i) => new Option(`Postura ${i + 1}`, i)));
  $('fire').hidden = m.kind !== 'drac';
  renderTabs();
  placeMarkers(m);
  renderNotes();
  gameCam();
}

$('pose').onchange = e => { poseIndex = +e.target.value; };
const toggle = id => { const b = $(id); b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); };
['anim', 'spin', 'fire'].forEach(toggle);
const isOn = id => $(id).getAttribute('aria-pressed') === 'true';
$('gamecam').onclick = gameCam;
$('general').oninput = e => { cl(current.key).general = e.target.value; save(); };
$('copy').onclick = async () => {
  $('out').select();
  // the LAN link is plain http, where the clipboard API does not exist
  try { await navigator.clipboard.writeText($('out').value); } catch { document.execCommand('copy'); }
  $('copy').textContent = 'Copiades';
  setTimeout(() => { $('copy').textContent = 'Copia totes les notes'; }, 1500);
};

// A click without a drag pins a note where it lands.
let down = null;
const canvas = renderer.domElement, ray = new THREE.Raycaster(), hitWorld = new THREE.Vector3();
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hit = ray.intersectObject(current.rig.root, true).find(h => h.object.isMesh && h.object.geometry.attributes.color);
  if (!hit) return;
  const node = hit.object.parent, n = cl(current.key);
  hitWorld.copy(hit.point);
  n.pins.push({ part: partOf(hit.object), pose: current.poses.length ? poseIndex : null, node: current.nodes.indexOf(node), point: node.worldToLocal(hitWorld).toArray(), text: '' });
  save();
  placeMarkers(current);
  renderNotes();
  $('notes').lastElementChild.querySelector('textarea').focus();
});

function resize() {
  const { clientWidth: w, clientHeight: h } = $('stage');
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('stage'));
resize();

const projected = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (isOn('anim')) time += dt;
  const P = current.poses[poseIndex], root = current.rig.root;
  if (current.kind === 'mula') { poseMula(current.rig, P, time, 0, 0); root.rotation.y = current.yaw + (P.yaw ?? 0); }
  if (current.kind === 'drac') { poseDrac(current.rig, P, time, 0, isOn('fire') ? 1 : 0); root.rotation.y = current.yaw + (P.yaw ?? 0); }
  if (isOn('spin')) orbit.autoRotate = true; else orbit.autoRotate = false;
  orbit.update();
  renderer.render(scene, camera);
  const { clientWidth: w, clientHeight: h } = $('stage');
  [...$('pins').children].forEach((el, i) => {
    const mk = current.markers[i];
    if (!mk) return;
    mk.getWorldPosition(projected).project(camera);
    el.style.left = `${(projected.x + 1) / 2 * w}px`;
    el.style.top = `${(1 - projected.y) / 2 * h}px`;
  });
  requestAnimationFrame(frame);
}

renderExport();
select(MODELS[0]);
requestAnimationFrame(frame);
window.__models = { MODELS, select, notes };
</script>
</body>
</html>
