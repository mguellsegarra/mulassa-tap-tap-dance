name: Keep Supabase active

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-availability
  cancel-in-progress: false

jobs:
  check-leaderboards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: beta # the test project's URL and key; production's are below
    env:
      BETA_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      BETA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Public client configuration; no administrator key is needed.
      SUPABASE_URL: https://oajlkitufibpfvhgtqwr.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_-pjXCr0l3GleGgniSUMEkw_K5dtYM1S
    steps:
      - name: Query each public leaderboard
        shell: bash
        run: |
          set -uo pipefail
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          failed=0
          # the joint board (get_leaderboard_all, 202609280005): one row is enough to keep a project awake
          for target in "production $SUPABASE_URL $SUPABASE_PUBLISHABLE_KEY" "beta $BETA_SUPABASE_URL $BETA_SUPABASE_PUBLISHABLE_KEY"; do
            read -r name url key <<< "$target"
            if curl --silent --show-error --fail \
                --connect-timeout 10 --max-time 30 \
                --retry 2 --retry-delay 5 --retry-max-time 100 \
                -X POST "$url/rest/v1/rpc/get_leaderboard_all" \
                -H "apikey: $key" \
                -H 'Content-Type: application/json' \
                --data '{"p_version":"mulassa-v1","p_period":"all","p_offset":0,"p_limit":1}' \
                --output "$response" &&
              python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert isinstance(data,list), "Expected a leaderboard array"' "$response"; then
              echo "$name: leaderboard available."
            else
              echo "::error::$name: leaderboard unavailable"; failed=1
            fi
          done
          exit $failed
