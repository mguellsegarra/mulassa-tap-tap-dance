<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 -8 96 114" class="mlb" role="img" aria-label="La Mulassa plora de riure"><style>.mlb{display:block;width:100%;height:auto;overflow:visible}
.mlb .b-head{transform-origin:50px 76px;animation:mlb-head 3.6s ease-in-out infinite}
.mlb .b-mouth{transform-origin:50px 69px;transform:scaleY(.42);animation:mlb-mouth 3.6s ease-in-out infinite}
.mlb .b-earl{transform-origin:40px 22px;animation:mlb-earl 3.6s ease-in-out infinite}
.mlb .b-earr{transform-origin:60px 22px;animation:mlb-earr 3.6s ease-in-out infinite}
.mlb .b-shut{animation:mlb-shut 3.6s step-end infinite}
.mlb .b-open{opacity:0;animation:mlb-open 3.6s step-end infinite}
.mlb .b-blush{transform-origin:50px 49px;animation:mlb-blush 3.6s ease-in-out infinite}
.mlb .b-nostrils{transform-origin:50px 63px;animation:mlb-nostrils 3.6s ease-in-out infinite}
.mlb [class^=b-l],.mlb [class^=b-r]{opacity:0;animation:3.6s linear infinite}
.mlb .b-l1{animation-name:mlb-l1}.mlb .b-l2{animation-name:mlb-l2}.mlb .b-l3{animation-name:mlb-l3}
.mlb .b-r1{animation-name:mlb-r1}.mlb .b-r2{animation-name:mlb-r2}.mlb .b-r3{animation-name:mlb-r3}
