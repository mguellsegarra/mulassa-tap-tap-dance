<!doctype html>
<html lang="ca" translate="no">
<head>
  <meta charset="utf-8">
  <script>addEventListener('dragstart', e => e.preventDefault());</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3d4a6c"><!-- the sky's top: Safari's bars blend into it -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mulassa Tower">
  <!-- its own app on a home screen (campanar.webmanifest), full screen; shortcut: Mulassa Games' icons until Tower has its own -->
  <link rel="manifest" href="/campanar.webmanifest">
  <meta name="robots" content="noindex"><!-- POC: out of search until it is a game -->
  <title>Mulassa Tower</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/baloo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/packages/plassa/src/base.css">
  <link rel="stylesheet" href="/packages/plassa/src/game.css">
  <link rel="stylesheet" href="/src/jocs/games/campanar/style.css">
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <canvas id="game" aria-label="El campanar"></canvas>
  <div id="edge" aria-hidden="true"></div>

  <div id="hud" hidden>
    <button id="pause" class="round-btn" aria-label="Pausa"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <div id="hud-mid"><div id="score" role="status">0</div></div>
  </div>

  <!-- The home, as the games' 2.0.0 home (Pop's): MULASSA's red logo with TOWER under it, the pitch, the record and Juga,
       in the middle of the sky; no tower (it rises on Juga, scene.js home). shortcut: the logo's markup and the home's
       layout are Pop's, copied until they move into Plassa (the extraction plan); then this page uses the base's. -->
  <div id="menu" class="home">
    <a id="back" class="exit corner-l" href="/jocs/"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.6" y="2.8" width="7.5" height="7.5" rx="1.6" transform="rotate(14 17.35 6.55)"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.6"/></svg><span class="exit-tip">Torna als jocs</span><i class="exit-dot" aria-hidden="true"></i></a>
    <div class="c-hero">
      <div class="c-text">
        <h1 class="tower-title" aria-label="Mulassa Tower"><span class="logo-box"><svg class="logo" aria-hidden="true" focusable="false" viewBox="0 -4 308.6 80" text-anchor="middle" stroke-linejoin="round">
          <!-- MULASSA as 2.0.0 draws it (deaadc4b, copied from jocs/memory): Baloo 2, the cream extrusion and outline -->
          <g font-family="'Baloo 2'" font-weight="800" font-size="77" letter-spacing="-5.5" stroke-width="11"><text x="154.3" textLength="300" lengthAdjust="spacingAndGlyphs" y="64" fill="#2a1a10" stroke="#2a1a10" stroke-width="15">MULASSA</text><text x="154.3" textLength="300" lengthAdjust="spacingAndGlyphs" y="60" fill="#2a1a10" stroke="#2a1a10" stroke-width="15">MULASSA</text><text x="154.3" textLength="300" lengthAdjust="spacingAndGlyphs" y="64" fill="#d8bf8f" stroke="#d8bf8f">MULASSA</text><text x="154.3" textLength="300" lengthAdjust="spacingAndGlyphs" y="60" fill="#e8382f" stroke="#fff3d6" style="paint-order:stroke">MULASSA</text></g>
        </svg><span class="logo-glint" aria-hidden="true"><svg viewBox="0 -4 308.6 80" text-anchor="middle" focusable="false"><text x="154.3" y="60" textLength="300" lengthAdjust="spacingAndGlyphs" font-family="'Baloo 2'" font-weight="800" font-size="77" letter-spacing="-5.5" fill="#fff">MULASSA</text></svg></span></span><span class="tower-word" aria-hidden="true"><i style="--i:0">T</i><i style="--i:1">O</i><i style="--i:2">W</i><i style="--i:3">E</i><i style="--i:4">R</i></span></h1>
        <p class="c-pitch">Toca per deixar caure cada pedra. El que sobresurt, cau. Fins on arribarà el campanar?</p>
        <div class="c-play-row">
          <button id="play" class="btn btn-primary btn-big btn-invite" data-keys-first><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg><span>Juga</span></button>
          <p class="c-best" id="menu-best"></p>
        </div>
      </div>
      <div class="c-art" aria-hidden="true"></div>
    </div>
  </div>
  <div id="pause-menu" class="cover" hidden>
    <div class="sheet">
      <h2>Pausa</h2>
      <div class="sheet-actions"><button id="resume" class="btn btn-primary">Continua</button><button id="quit" class="btn">Surt</button></div>
    </div>
  </div>
  <!-- The end's first look: the whole campanar, its metres on top, a tap for the sheet (main.js toSheet) -->
  <div id="end-banner" hidden><b id="banner-m"></b><span id="banner-real"></span><span id="banner-best" hidden></span></div>
  <p id="end-tap" hidden>Toca per continuar</p>
  <div id="end-menu" class="cover" hidden>
    <div class="sheet">
      <h2 id="end-title"></h2>
      <p class="result" id="end-score">0</p>
      <p class="result-sub" id="end-real"></p>
      <p class="result-sub" id="end-best"></p>
      <div class="sheet-actions">
        <button id="again" class="btn btn-primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg><span>Torna-hi</span></button>
        <button id="to-menu" class="btn"><span>Menú</span></button>
      </div>
    </div>
  </div>
  <div id="boot" class="cover"><div class="boot-card"><div class="art" id="boot-art"><!-- mula-load --></div><p class="boot-line" id="boot-line" aria-live="polite"></p></div></div><!-- boot-first-line -->
  <div id="rotate" role="alert"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="arr" d="M24 5A19 19 0 0 1 43 24M39.5 20.5 43 24l3.5-3.5M24 43A19 19 0 0 1 5 24M8.5 27.5 5 24l-3.5 3.5"/><g class="ph"><rect x="18" y="10" width="12" height="28" rx="2.5"/><path d="M22.5 34h3"/></g></svg><h2><span class="r-phone">Gira el mòbil</span><span class="r-tablet">Gira la tauleta</span></h2><b><span class="r-phone">En vertical per jugar</span><span class="r-tablet">En horitzontal per jugar</span></b></div>
  <script id="boot-watchdog" src="/packages/plassa/src/boot-watchdog.js"></script>
  <script type="module" src="/src/jocs/games/campanar/main.js"></script>
</body>
</html>
