name: Desplegament

# Two channels from one branch: every push to main goes to beta.mulassa.cat (test Supabase),
# a version tag (v1.2.3, matching package.json) goes to mulassa.cat. Running it by hand on a tag redeploys that release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.ref_type == 'tag' && 'production' || 'beta' }}
  queue: max # keep a pending release when a later push only changes documentation
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether the public build changed
        id: scope
        env:
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_BASE_SHA: ${{ github.event.before }}
        run: node tools/deploy/pages-deploy-needed.mjs

  migrate:
    uses: ./.github/workflows/supabase-migrations.yml
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    with:
      environment: ${{ github.ref_type == 'tag' && 'production' || 'beta' }}
    secrets:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_type == 'tag' && 'production' || 'beta' }}
    env:
      CHANNEL: ${{ github.ref_type == 'tag' && 'production' || 'beta' }}
      # Public client configuration (Settings → Variables → Actions); same names as .env.local.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_LEADERBOARD_PUBLISHING_ENABLED: ${{ vars.VITE_LEADERBOARD_PUBLISHING_ENABLED }}
      VITE_LEADERBOARD_CAPTCHA_REQUIRED: ${{ vars.VITE_LEADERBOARD_CAPTCHA_REQUIRED }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
      VITE_FEEDBACK_ENABLED: ${{ vars.VITE_FEEDBACK_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version's PATCH is the commit count (vite.config.js)
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; npm run check's Python tests run through uv
      # beta must never build against the real leaderboard, and a tag must name the version it ships
      - name: Check the channel
        run: |
          if [ "$CHANNEL" = beta ]; then
            case "$VITE_SUPABASE_URL" in ''|*oajlkitufibpfvhgtqwr*) echo "beta needs the test Supabase (environment beta)"; exit 1;; esac
          else
            test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")" || { echo "tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          fi
      - run: npm ci
      # checks + vite build + the Pages allowlist artifact in dist/
      - run: npm run build:pages
      - name: Deploy dist/
        run: npx --yes wrangler@4.142.0 pages deploy dist --project-name mulassa-tap-tap-dance --branch ${{ env.CHANNEL == 'production' && 'main' || 'beta' }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
