<!doctype html>
<html lang="ca" translate="no">
<head>
  <meta charset="utf-8">
  <script>addEventListener('dragstart', e => e.preventDefault());</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4fa8ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="robots" content="noindex"><!-- POC: not for search yet -->
  <title>Lane Rush (POC)</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/baloo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jersey-10-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/packages/plassa/src/base.css">
  <link rel="stylesheet" href="/packages/plassa/src/game.css">
  <link rel="stylesheet" href="/src/jocs/games/lane/style.css">
</head>
<body>
  <canvas id="game" aria-label="El camí cap a Valls"></canvas>
  <div id="count" aria-hidden="true" hidden><b></b></div>
  <div id="flash" aria-hidden="true"></div><!-- the hit lights the screen red (main.js) -->
  <!-- the run's distance at the top (main.js) -->
  <div id="hud" hidden><span id="dist" role="status"><b id="dist-n">0</b><small>m</small></span></div>

  <!-- POC words are provisional: the final copy is written later -->
  <div id="menu" class="cover home-cover">
    <a id="back" class="exit corner-l" href="/jocs/"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.6" y="2.8" width="7.5" height="7.5" rx="1.6" transform="rotate(14 17.35 6.55)"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.6"/></svg><span class="exit-tip">Torna als jocs</span></a>
    <div class="sheet">
      <h2>Corre cap a Valls</h2>
      <p class="result-sub">Llisca o toca un costat per canviar de carril. Esquiva tot el que ve.</p>
      <p class="result-sub" id="menu-best" hidden></p>
      <div class="sheet-actions"><button id="play" class="btn btn-primary btn-big" data-keys-first><span>Juga</span></button></div>
    </div>
  </div>
  <div id="pause-menu" class="cover" hidden>
    <div class="sheet">
      <h2>Pausa</h2>
      <div class="sheet-actions"><button id="resume" class="btn btn-primary">Continua</button><button id="quit" class="btn">Surt</button></div>
    </div>
  </div>
  <div id="end-menu" class="cover" hidden>
    <div class="sheet">
      <h2 id="end-title">Ai!</h2>
      <p class="result" id="end-score">0 m</p>
      <p class="result-sub" id="end-sub"></p>
      <div class="sheet-actions"><button id="again" class="btn btn-primary">Torna-hi</button><button id="to-menu" class="btn">Menú</button></div>
    </div>
  </div>
  <div id="boot" class="cover"><div class="boot-card"><div class="art" id="boot-art"><!-- mula-load --></div><p class="boot-line" id="boot-line" aria-live="polite"></p></div></div><!-- boot-first-line -->
  <div id="rotate" role="alert"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="arr" d="M24 5A19 19 0 0 1 43 24M39.5 20.5 43 24l3.5-3.5M24 43A19 19 0 0 1 5 24M8.5 27.5 5 24l-3.5 3.5"/><g class="ph"><rect x="18" y="10" width="12" height="28" rx="2.5"/><path d="M22.5 34h3"/></g></svg><h2><span class="r-phone">Gira el mòbil</span><span class="r-tablet">Gira la tauleta</span></h2><b><span class="r-phone">En vertical per jugar</span><span class="r-tablet">En horitzontal per jugar</span></b></div>
  <script id="boot-watchdog" src="/packages/plassa/src/boot-watchdog.js"></script>
  <script type="module" src="/src/jocs/games/lane/main.js"></script>
</body>
</html>
