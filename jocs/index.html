<!doctype html>
<!-- Mulassa Games, mulassa.cat/jocs/: the games' selector, its own light page on Plassa (src/jocs/menu/main.js). Nothing of
     Mulassa Tap Tap Dance loads here; «Juga» on its card goes to / (docs/jocs/README.md). -->
<html lang="ca" translate="no">
<head>
  <meta charset="utf-8">
  <script>addEventListener('dragstart', e => e.preventDefault());</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120b07">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mulassa">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Mulassa Games</title>
  <style>html { background: #120b07; }</style><!-- before the stylesheets arrive: Safari showed a white page meanwhile -->
  <link rel="canonical" href="https://mulassa.cat/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/baloo-2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jersey-10-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/packages/plassa/src/base.css">
  <link rel="stylesheet" href="/packages/plassa/src/game.css">
  <link rel="stylesheet" href="/src/jocs/menu/style.css">
</head>
<body>
  <main id="games-menu" tabindex="-1" aria-labelledby="games-title">
    <!-- the title's MULASSA lettering (as mulassa.cat's .sel-logo) with its glint sweeping across; GAMES under it, as TAP TAP DANCE:
         «Mulassa Games» is a name, not translated -->
    <h1 id="games-title"><svg class="games-logo" aria-hidden="true" focusable="false" viewBox="0 -4 308.6 80" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
      <defs><linearGradient id="games-glint" gradientUnits="userSpaceOnUse" x1="-150" y1="0" x2="-60" y2="40"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="0;560;560" keyTimes="0;.3;1" dur="4.5s" repeatCount="indefinite"/></linearGradient></defs>
      <g font-family="'Jersey 10'" font-size="100" stroke-width="12"><text x="154.3" y="66.6" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#5e1514" stroke="#5e1514">MULASSA</text><text x="154.3" y="60.6" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#c0283c" stroke="#fff3d6">MULASSA</text><text x="154.3" y="60.6" textLength="300" lengthAdjust="spacingAndGlyphs" fill="url(#games-glint)" stroke="none">MULASSA</text></g>
    </svg><span class="sr-only">Mulassa Games</span><span class="games-word" aria-hidden="true"><i style="--i:0">G</i><i style="--i:1">A</i><i style="--i:2">M</i><i style="--i:3">E</i><i style="--i:4">S</i></span></h1>
    <!-- mulassa.cat's speaker: Plassa's one music switch (main.js) -->
    <button id="games-music" type="button" class="round-btn" data-state="on" aria-label="Silencia el so del menú"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5h4l5-4.5v14l-5-4.5h-4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.8 6.2a8.5 8.5 0 0 1 0 11.6"/></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5h4l5-4.5v14l-5-4.5h-4z"/><path d="m16.5 9.5 5 5M21.5 9.5l-5 5"/></svg></button>
    <div id="games-hero"><img id="games-hero-back" alt=""><img id="games-hero-art" alt=""><video id="games-hero-video" muted loop playsinline preload="auto" aria-hidden="true"></video><div id="games-hero-text"><span id="games-hero-name"></span><span id="games-hero-desc"></span><button id="games-hero-play" type="button" class="game-play" data-keys-first><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg><span data-t="play">Juga</span></button></div></div>
    <div id="games-grid" class="games-grid">
        <button type="button" class="game-card" data-game="pop" data-hero="/jocs/menu/hero/pop.jpg" data-video="/jocs/menu/video/pop.mp4" data-video-tall="/jocs/menu/video/pop-tall.mp4"><span class="por"><img src="/jocs/menu/cards/pop.jpg" alt="" width="600" height="750"></span><span class="nb"><span class="sel-card-name" data-t="pop">Mulassa Pop</span><small class="game-desc" data-t="popDesc">Atrapa la Mulassa. Evita els Dracs.</small></span><span class="ribbon" data-t="new">Nou!</span></button>
        <button type="button" class="game-card" data-game="tap" data-hero="/jocs/menu/hero/tap.jpg" data-video="/jocs/menu/video/tap.mp4" data-video-tall="/jocs/menu/video/tap-tall.mp4"><span class="por"><img src="/jocs/menu/cards/tap.jpg" alt="" width="600" height="750"></span><span class="nb"><span class="sel-card-name">Mulassa Tap Tap Dance</span><small class="game-desc">Balla amb les figures al ritme de la música.</small></span></button>
        <button type="button" class="game-card" data-game="aviat-1" data-soon data-hero="/jocs/menu/hero/aviat-1.jpg"><span class="por"><img src="/jocs/menu/cards/aviat-1.jpg" alt="" width="600" height="750"></span><span class="nb"><span class="sel-card-name" data-t="soon">Sorpresa</span><small class="game-desc" data-t="soonDesc">Un joc nou està de camí.</small></span></button>
        <button type="button" class="game-card" data-game="aviat-2" data-soon data-hero="/jocs/menu/hero/aviat-2.jpg"><span class="por"><img src="/jocs/menu/cards/aviat-2.jpg" alt="" width="600" height="750"></span><span class="nb"><span class="sel-card-name" data-t="soon">Sorpresa</span><small class="game-desc" data-t="soonDesc">Un joc nou està de camí.</small></span></button>
        <button type="button" class="game-card" data-game="aviat-3" data-soon data-hero="/jocs/menu/hero/aviat-3.jpg"><span class="por"><img src="/jocs/menu/cards/aviat-3.jpg" alt="" width="600" height="750"></span><span class="nb"><span class="sel-card-name" data-t="soon">Sorpresa</span><small class="game-desc" data-t="soonDesc">Un joc nou està de camí.</small></span></button>
    </div>
  </main>
  <div id="rotate" role="alert"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="arr" d="M24 5A19 19 0 0 1 43 24M39.5 20.5 43 24l3.5-3.5M24 43A19 19 0 0 1 5 24M8.5 27.5 5 24l-3.5 3.5"/><g class="ph"><rect x="18" y="10" width="12" height="28" rx="2.5"/><path d="M22.5 34h3"/></g></svg><h2><span class="r-phone" data-t="rotate.phone">Gira el mòbil</span><span class="r-tablet" data-t="rotate.tablet">Gira la tauleta</span></h2><b><span class="r-phone" data-t="rotate.phoneSub">En vertical per jugar</span><span class="r-tablet" data-t="rotate.tabletSub">En horitzontal per jugar</span></b></div>
  <script type="module" src="/src/jocs/menu/main.js"></script>
</body>
</html>
