<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bou Tradicional · model</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#b8c7c9;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;left:8px;top:8px;display:flex;gap:6px}#views{position:fixed;left:8px;bottom:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#cam{position:fixed;right:8px;top:8px;font:12px ui-monospace,monospace;background:#fff8e8e0;padding:6px 8px;border-radius:8px;white-space:pre}
#bar select,#bar button,#views button{font:15px system-ui;padding:8px 10px;border-radius:10px;border:1px solid #6b5a3c;background:#fff8e8}</style></head>
<body><canvas id="c"></canvas><div id="bar"><select id="m"></select><button id="spin">Gira</button><button id="dance">Balla</button><button id="music">Música</button>
</div>
<div id="views"><button data-v="front">Davant</button><button data-v="side">Costat</button><button data-v="q">3/4</button><button data-v="top">Dalt</button><button data-v="head">Cap</button><button data-v="back">Darrere</button>
<button id="anim">Atura l'animació</button><input id="time" type="range" min="0" max="15" step="0.02" value="0" disabled><span id="tlab"></span><button id="copy">Copia la vista</button></div>
<div id="cam"></div>
<script type="module">
// Inspector (Marc, 2026-10-24): drag the tail, preset views, double-click to orbit round the clicked point, pause and scrub the
// head's gag, and «Copia la vista» copies one line (head, time, camera, target) to give directions from.
// Free 3D look at the Bou model, scene/models/bou.js (dev only; «Balla» shakes it so the tail swings): drag to orbit, pinch or wheel to zoom, two fingers to pan.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildBou } from '/src/scene/models/bou.js';
import { BOU_HEADS } from '/src/scene/models/bou-heads.js';
import { bouPose, newBouPose } from '/src/game/bou-dance.js';
import { createBouMotion } from '/src/scene/bou-motion.js';
import bouSong from '/src/song-bou.json';
const models = { bou: 'Bou Tradicional (p13)', ...Object.fromEntries(Object.entries(BOU_HEADS).map(([k, [n]]) => [k, `Cap ${k.toUpperCase()} · ${n}`])) };
const sel = document.getElementById('m');
for (const [k, n] of Object.entries(models)) sel.add(new Option(n, k));
const q = new URLSearchParams(location.search); sel.value = models[q.get('cap')] ? q.get('cap') : 'bou';
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color('#b8c7c9');
scene.add(new THREE.HemisphereLight('#fff4df', '#867253', 2.3));
const sun = new THREE.DirectionalLight('#fff0cf', 2.2); sun.position.set(-4, 8, 4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshLambertMaterial({ color: '#d5c69f' }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -.005; scene.add(floor);   // below the soles (they shimmered on it)
const camera = new THREE.PerspectiveCamera(40, 1, .05, 60); camera.position.set(4.5, 2.4, 5.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, .2); controls.enableDamping = true; controls.minDistance = 1.2; controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * .52;
let rig = null, motion = null;
// For automated sweeps (flicker checks): the camera and its controls.
window.__orbit = { get rig() { return rig; }, camera, controls, render: () => { controls.update(); renderer.render(scene, camera); } };
function load(key) {
  if (rig) { scene.remove(rig.root, ...rig.feet, ...rig.legs); rig.dispose?.(); }
  rig = buildBou({ cap: key === 'bou' ? null : key });
  scene.add(rig.root, ...rig.feet, ...rig.legs);
  [[-.12, -.66], [.12, -.66], [-.12, .66], [.12, .66]].forEach(([x, z], i) => rig.feet[i].position.set(x, 0, z));
  rig.poseLegs(); rig.swingTail?.reset();
  
}
sel.onchange = () => load(sel.value); load(sel.value);
// «Balla»: a little test dance (steps back and forth, turns, a bow) so the tail's weight shows.
const danceBtn = document.getElementById('dance'); let dancing = false, tDance = 0, last = performance.now();
danceBtn.onclick = () => { dancing = !dancing; danceBtn.textContent = dancing ? 'Quiet' : 'Balla'; if (!dancing) load(sel.value); };
const spin = document.getElementById('spin');
spin.onclick = () => { controls.autoRotate = !controls.autoRotate; spin.textContent = controls.autoRotate ? 'Atura' : 'Gira'; };
function frame() {
  const w = innerWidth, h = innerHeight;
  if (renderer.domElement.width !== Math.round(w * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    // Back off on narrow screens so the whole Bou (~3.6 m with the head) fits across.
    const fit = 2.4 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2) * Math.min(1, camera.aspect));
    camera.position.sub(controls.target).setLength(Math.max(7.5, fit)).add(controls.target);
  }
  const now = performance.now(), dt = Math.min(.1, (now - last) / 1000); last = now;
  if (dancing) {
    tDance += dt; const k = tDance;
    rig.root.position.z = .35 * Math.sin(k * 2.2); rig.root.position.y = .04 * Math.abs(Math.sin(k * 4.4));
    rig.root.rotation.y = .5 * Math.sin(k * 1.1);
    rig.body.rotation.x = .18 * Math.sin(k * 2.2 + 1) * (Math.sin(k * .5) > 0 ? 1 : .3); rig.body.rotation.z = .06 * Math.sin(k * 3.3);
    // The carriers walk along with it.
    const c = Math.cos(rig.root.rotation.y), sn = Math.sin(rig.root.rotation.y);
    [[-.12, -.66], [.12, -.66], [-.12, .66], [.12, .66]].forEach(([x, z], i) => {
      rig.feet[i].position.set(x * c + z * sn, 0, -x * sn + z * c + rig.root.position.z); rig.feet[i].rotation.y = rig.root.rotation.y; });
    rig.poseLegs();
  }
  if (!paused) gagT = now / 1000;
  let beat;
  if (musicOn) { // the game's whole dance on the song (scene/bou-motion.js: its path, turns, planned steps, tail); paused, it holds
    if (!song.paused) shown = motion(song.currentTime, dt); beat = shown?.beat;
  } else {
    if (!paused) rig.swingTail?.beat?.(gagT * 1.6);
    rig.swingTail?.(dt);
  }
  rig.cap?.play(gagT, beat);
  const f = x => x.toFixed(2), c = camera.position, g = controls.target;
  camT.textContent = `t ${f(gagT % 15)} s\ncam ${f(c.x)} ${f(c.y)} ${f(c.z)}\nobj ${f(g.x)} ${f(g.y)} ${f(g.z)}`;
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
// Views: the Bou faces +z, its head round (0, 1.6, 1.6).
const VIEWS = { front: [[0, 1.6, 6.5], [0, 1.3, 0]], side: [[7, 1.4, 0], [0, 1.2, 0]], q: [[4.5, 2.4, 5.5], [0, 1.1, .2]],
  top: [[0, 8, .01], [0, 1, 0]], head: [[2, 2.1, 4.4], [0, 1.5, 1.7]], back: [[0, 1.8, -6.5], [0, 1.2, 0]] };
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const [p, t] = VIEWS[b.dataset.v]; camera.position.set(...p); controls.target.set(...t); });
let paused = false, gagT = 0;
const camT = document.getElementById('cam'), time = document.getElementById('time'), tlab = document.getElementById('tlab');
document.getElementById('anim').onclick = e => { paused = !paused; time.disabled = !paused; time.value = gagT % 15; e.target.textContent = paused ? 'Reprèn l\'animació' : 'Atura l\'animació'; };
time.oninput = () => { gagT = +time.value; };
document.getElementById('copy').onclick = e => {
  const r = v => +v.toFixed(2), c = camera.position, g = controls.target;
  navigator.clipboard.writeText(JSON.stringify({ cap: sel.value, t: r(gagT % 15), cam: [r(c.x), r(c.y), r(c.z)], obj: [r(g.x), r(g.y), r(g.z)] }));
  e.target.textContent = 'Copiat!'; setTimeout(() => (e.target.textContent = 'Copia la vista'), 1200);
};
// Double-click a part: the orbit turns round that point.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('dblclick', e => {
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(rig.root, true)[0]; if (hit) controls.target.copy(hit.point);
});
controls.minDistance = .4;
// «Música»: the Bou's song, the Bou bouncing in place on it: knees, waddle and nod (the game's), head on the beat.
let musicOn = false, shown = null;
const song = new Audio('/' + bouSong.audio);
song.muted = q.has('mute'); song.loop = true; window.__song = song; window.__bouPose = t => bouPose(t, newBouPose());   // tools/bou-sweep.mjs
document.getElementById('music').onclick = e => {
  musicOn = song.paused;
  if (musicOn) { if (dancing) danceBtn.click(); motion = createBouMotion(rig); song.play(); e.target.textContent = 'Para la música'; }
  else { song.pause(); e.target.textContent = 'Música'; load(sel.value); }
};
// Grab the tail (Marc): drag it on a plane facing the camera, let go and it swings by its own weight (bou.js
// makeTailSwing). Caught before OrbitControls sees the press.
const grabPlane = new THREE.Plane(), grabAt = new THREE.Vector3(), camDir = new THREE.Vector3();
const toRay = e => { ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, camera); };
let holding = false;
addEventListener('pointerdown', e => {
  if (e.target !== renderer.domElement) return;
  toRay(e); const hit = ray.intersectObject(rig.tail, true)[0]; if (!hit) return;
  e.stopPropagation(); holding = true; renderer.domElement.setPointerCapture(e.pointerId);
  grabPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(camDir), hit.point); rig.swingTail.grab = hit.point.clone();
}, true);
addEventListener('pointermove', e => {
  if (holding) { e.stopPropagation(); toRay(e); if (ray.ray.intersectPlane(grabPlane, grabAt)) rig.swingTail.grab.copy(grabAt); return; }
  if (e.target === renderer.domElement && !e.buttons) { toRay(e); renderer.domElement.style.cursor = ray.intersectObject(rig.tail, true).length ? 'grab' : ''; }
}, true);
addEventListener('pointerup', e => { if (!holding) return; e.stopPropagation(); holding = false; rig.swingTail.grab = null; }, true);
frame();
</script></body></html>
