<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140c07">
  <title>Mulassa Memory</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mulassa">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/jocs/games/memory/styles.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="vignette"></div>
  <main id="page">
    <header id="hud">
      <div class="stat"><span>Parelles</span><b id="pairs">0/0</b></div>
      <div class="stat"><span>Moviments</span><b id="moves">0</b></div>
      <button id="sound" class="round-btn" type="button" aria-label="So">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h4l5 4v-13l-5 4z"/><path class="on" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
      </button>
      <button id="menu" class="round-btn" type="button" aria-label="Nivells">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      </button>
    </header>
    <div id="area"></div>
  </main>
  <div id="live" class="sr" role="status"></div>
  <dialog id="sheet" class="sheet" tabindex="-1" autofocus>
    <svg id="logo" viewBox="0 0 300 118" role="img" aria-label="Mulassa Memory">
      <g font-family="'Jersey 10'" text-anchor="middle" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
        <text x="150" y="68" font-size="84" textLength="280" lengthAdjust="spacingAndGlyphs" fill="#5e1514" stroke="#5e1514">MULASSA</text>
        <text x="150" y="62" font-size="84" textLength="280" lengthAdjust="spacingAndGlyphs" fill="#c0283c" stroke="#fff3d6">MULASSA</text>
        <text x="150" y="108" font-family="'Baloo 2'" font-weight="800" font-size="40" letter-spacing="3" stroke-width="7" fill="#6ec8ff" stroke="#2a1a10">MEMORY</text>
      </g>
    </svg>
    <div id="row" aria-hidden="true"></div>
    <p id="msg">Tria un nivell i troba les parelles.</p>
    <div id="levels"></div>
    <a id="back" class="btn" href="/#jocs">Torna a Mulassa</a>
  </dialog>
  <script type="module" src="/src/jocs/games/memory/main.js"></script>
</body>
</html>
