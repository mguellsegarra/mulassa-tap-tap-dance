name: Database backup

# BACKUP_ENABLED gates all backups. Scheduled backups also require the separate repository
# variable BACKUP_SCHEDULE_ENABLED=true, set only after the Sentry alert tests and access review.
# Read docs/db-backup.md before activating. Production access is restricted to the default branch.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC; 04:17 winter / 05:17 summer in Europe/Madrid

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BACKUP_SCHEDULE_ENABLED == 'true')) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: db-backup-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # age is built from source by version tag; the Go module proxy and checksum database verify it.
      - name: Install age
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          go install filippo.io/age/cmd/age@v1.3.2
          echo "$GOBIN" >> "$GITHUB_PATH"

      # The client must be at least the server's major version. The coordinator then refuses to run
      # unless pg_dump reports exactly BACKUP_PG_MAJOR.
      - name: Install the PostgreSQL client
        env:
          PG_MAJOR: ${{ vars.BACKUP_PG_MAJOR }}
        run: |
          set -euo pipefail
          [[ "$PG_MAJOR" =~ ^[0-9]{2}$ ]]
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --no-install-recommends -y "postgresql-client-$PG_MAJOR"
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - name: Install the locked Python dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --only-binary=:all: -r tools/db-backup-requirements.txt

      - name: Prepare the private work area
        env:
          CA_PEM: ${{ vars.BACKUP_PG_CA_PEM }}
        run: |
          set -euo pipefail
          [ -n "$CA_PEM" ]
          mkdir -m 700 "$RUNNER_TEMP/db-backup"
          printf '%s\n' "$CA_PEM" > "$RUNNER_TEMP/db-backup-ca.pem"

      - name: Back up, encrypt, upload and verify
        env:
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          BACKUP_PRODUCTION_POLICY: ${{ vars.BACKUP_PRODUCTION_POLICY }}
          BACKUP_PG_HOST: ${{ vars.BACKUP_PG_HOST }}
          BACKUP_PG_PORT: ${{ vars.BACKUP_PG_PORT }}
          BACKUP_PG_DATABASE: ${{ vars.BACKUP_PG_DATABASE }}
          BACKUP_PG_USER: ${{ vars.BACKUP_PG_USER }}
          BACKUP_PG_MAJOR: ${{ vars.BACKUP_PG_MAJOR }}
          BACKUP_PG_CA_FILE: ${{ runner.temp }}/db-backup-ca.pem
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_SENTRY_ENABLED: ${{ vars.BACKUP_SENTRY_ENABLED }}
          BACKUP_TMP_ROOT: ${{ runner.temp }}/db-backup
          BACKUP_PG_PASSWORD: ${{ secrets.BACKUP_PG_PASSWORD }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_SENTRY_CHECKIN_URL: ${{ secrets.BACKUP_SENTRY_CHECKIN_URL }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -I tools/db_backup.py run-production
