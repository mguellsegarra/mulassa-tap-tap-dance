<style>.c{width:150px;height:120px;overflow:visible}.c *{transform-box:view-box}
.c .leg{animation:c-leg 1s infinite}.c .l2{animation-delay:-.5s}
.c .l1:nth-child(1),.c .l2:nth-child(2){transform-origin:60px 110px}.c .l1:nth-child(3),.c .l2:nth-child(4){transform-origin:136px 110px}
.c-bob{animation:c-bob .5s infinite}
.c-tail{transform-origin:42px 74px;animation:c-tail 1s ease-in-out infinite;animation-delay:-.85s}
.c-neck{transform-origin:148px 72px;animation:c-gest 2s infinite}
.c-nod{transform-origin:148px 72px;animation:c-nod .5s ease-in-out infinite;animation-delay:-.44s}
.c-head{transform-origin:156px 32px}
.c-jaw{transform-origin:159px 38px;animation:c-jaw 2s infinite}
.c-ear{transform-origin:151px 18px;animation:c-ear .5s ease-in-out infinite;animation-delay:-.38s}.c-ear.e2{transform-origin:158px 18px;animation-delay:-.32s}
.c-clac{opacity:0;transform-origin:192px 44px;animation:c-clac 2s infinite}
@keyframes c-leg{0%,10%{transform:none;animation-timing-function:ease-out}28%{transform:translate(1px,-9px) rotate(-6deg);animation-timing-function:ease-in}46%{transform:translate(0,-1px)}52%,100%{transform:none}}
@keyframes c-bob{0%{transform:translateY(.5px)}8%{transform:translateY(2px)}22%{transform:none}62%{transform:translateY(-2px)}100%{transform:translateY(.5px)}}
@keyframes c-tail{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
@keyframes c-nod{0%,100%{transform:none}18%{transform:rotate(2.5deg)}70%{transform:rotate(-1.5deg)}}
@keyframes c-gest{0%,56%{transform:none;animation-timing-function:ease-in-out}68%{transform:rotate(-10deg);animation-timing-function:cubic-bezier(.5,0,.2,1)}73%{transform:rotate(6deg)}80%{transform:rotate(-2.5deg)}88%{transform:rotate(1deg)}95%,100%{transform:none}}
@keyframes c-jaw{0%,69%{transform:none;animation-timing-function:ease-out}73%{transform:rotate(17deg)}79%{transform:rotate(14deg);animation-timing-function:ease-in}83%{transform:none}86%{transform:rotate(3deg)}89%,100%{transform:none}}
@keyframes c-ear{0%,100%{transform:none}25%{transform:rotate(-8deg)}60%{transform:rotate(5deg)}}
@keyframes c-clac{0%,71%{opacity:0;transform:scale(.6)}74%{opacity:1;transform:none}82%,100%{opacity:0;transform:scale(1.15)}}@media (prefers-reduced-motion: reduce){.c *{animation:none!important}.c{animation:rm-pulse 2.4s ease-in-out infinite}}</style></svg>