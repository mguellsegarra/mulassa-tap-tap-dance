name: Supabase functions

# Called by deploy-pages.yml only after channel validation and migrations succeed.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      PROJECT_REF: ${{ inputs.environment == 'production' && 'oajlkitufibpfvhgtqwr' || vars.SUPABASE_PROJECT_REF }}
      # Needs Edge Functions read-write; the database migrations job does not use it.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # pinned: `latest` asks the GitHub API on every run (a 503 there failed a deploy) and takes new majors unasked
      # --use-api bundles on Supabase's side: no Docker on the runner. verify_jwt comes from supabase/config.toml.
      - run: |
          [ -n "$PROJECT_REF" ] || { echo "missing Supabase project"; exit 1; }
          if [ "${{ inputs.environment }}" != production ] && [ "$PROJECT_REF" = oajlkitufibpfvhgtqwr ]; then echo "beta must not deploy functions to production"; exit 1; fi
          supabase functions deploy delete-player --project-ref "$PROJECT_REF" --use-api --yes
          supabase functions deploy pop-score --project-ref "$PROJECT_REF" --use-api --yes
